services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Remplacer ce service par CELERY_BROKER_URL/CELERY_RESULT_BACKEND/JOB_STORE_URL
    # pointant vers Redis Cloud si vous préférez ne pas héberger Redis localement.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn -w 4 -k gthread --bind 0.0.0.0:8800 app:app
    restart: unless-stopped
    # Port interne uniquement — Caddy expose le HTTPS sur 8800 côté hôte.
    expose:
      - "8800"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_STORE_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8800:8800"   # HTTPS public
      - "80:80"        # HTTP → redirect HTTPS (ACME HTTP-01 challenge)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  celery-worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_STORE_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  celery-beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_STORE_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
